function elang(o){o=o||{};return{zh:o.zh||'',en:o.en||'',bo:o.bo||''}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function langIn(o,path){return '<div class="lang-row"><div><div class="lang-label">中</div><input class="w-full border rounded px-1 py-1 text-sm" value="'+esc(o.zh)+'" onchange="'+path+'.zh=this.value"></div><div><div class="lang-label">EN</div><input class="w-full border rounded px-1 py-1 text-sm" value="'+esc(o.en)+'" onchange="'+path+'.en=this.value"></div><div><div class="lang-label">藏</div><input class="w-full border rounded px-1 py-1 text-sm" value="'+esc(o.bo)+'" onchange="'+path+'.bo=this.value"></div></div>'}
function loadAll(){let t=DEFAULT_TEXTS;try{const r=localStorage.getItem('snowrealm_home_texts');if(r)t=Object.assign({},DEFAULT_TEXTS,JSON.parse(r).zh||JSON.parse(r))}catch(e){}Object.keys(DEFAULT_TEXTS).forEach(k=>{const el=document.getElementById('t_'+k);if(el)el.value=t[k]||''});

try{features=JSON.parse(localStorage.getItem('snowrealm_features12'))||JSON.parse(JSON.stringify(DEFAULT_FEATURES))}catch(e){features=JSON.parse(JSON.stringify(DEFAULT_FEATURES))}renderFeatures();

function renderPortals(){document.getElementById('portalsList').innerHTML=portals.map((p,i)=>{p.title=elang(p.title);p.desc=elang(p.desc);return '<div class="border rounded p-2 mb-2"><div class="flex gap-2 mb-1"><img class="thumb" src="'+esc(p.img)+'"><input class="flex-1 border rounded px-1 text-xs font-mono" value="'+esc(p.img)+'" onchange="portals['+i+'].img=this.value"></div>'+langIn(p.title,'portals['+i+'].title')+langIn(p.desc,'portals['+i+'].desc')+'</div>'}).join('')}
function renderTreasures(){document.getElementById('treasuresList').innerHTML=treasures.map((p,i)=>{p.name=elang(p.name);p.subtitle=elang(p.subtitle);return '<div class="border rounded p-2 mb-2"><div class="text-xs text-slate-500">#'+p.id+'</div><div class="flex gap-2"><img class="thumb" src="'+esc(p.img)+'"><input class="flex-1 border rounded px-1 text-xs font-mono" value="'+esc(p.img)+'" onchange="treasures['+i+'].img=this.value"></div>'+langIn(p.name,'treasures['+i+'].name')+langIn(p.subtitle,'treasures['+i+'].subtitle')+'</div>'}).join('')}
function renderFeatures(){document.getElementById('featuresList').innerHTML=features.map((p,i)=>{p.name=elang(p.name);p.sub=elang(p.sub);return '<div class="border rounded p-2 mb-2"><div class="text-xs">'+esc(p.num)+'</div><div class="flex gap-2"><img class="thumb" src="'+esc(p.img)+'"><input class="flex-1 border rounded px-1 text-xs font-mono" value="'+esc(p.img)+'" onchange="features['+i+'].img=this.value"></div>'+langIn(p.name,'features['+i+'].name')+langIn(p.sub,'features['+i+'].sub')+'</div>'}).join('')}
