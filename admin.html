function elang(o){o=o||{};return{zh:o.zh||'',en:o.en||'',bo:o.bo||''}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}

function renderList(boxId,arr,k1,k2,hasPrice){document.getElementById(boxId).innerHTML=arr.map((p,i)=>{p[k1]=elang(p[k1]);p[k2]=elang(p[k2]);return '<div class="border rounded p-2 mb-2 space-y-1"><div class="flex gap-2"><img class="thumb" src="'+esc(p.img)+'"><input class="flex-1 border rounded px-1 text-xs font-mono" value="'+esc(p.img)+'" onchange="'+(boxId==='productsList'?'products':'gallery')+'['+i+'].img=this.value">'+(hasPrice?'<input class="w-20 border rounded px-1 text-sm" value="'+esc(p.price)+'" onchange="products['+i+'].price=this.value">':'')+'</div>'+langIn(p[k1],(boxId==='productsList'?'products':'gallery')+'['+i+'].'+k1)+langIn(p[k2],(boxId==='productsList'?'products':'gallery')+'['+i+'].'+k2)+'</div>'}).join('')}
function saveHome(){const zh={};Object.keys(DEFAULT_TEXTS).forEach(k=>{const el=document.getElementById('t_'+k);if(el)zh[k]=el.value});localStorage.setItem('snowrealm_home_texts',JSON.stringify({zh}));alert('已保存')}
function savePortals(){localStorage.setItem('snowrealm_portals',JSON.stringify(portals));alert('三大入口已保存')}
function saveTreasures(){localStorage.setItem('snowrealm_treasures',JSON.stringify(treasures));alert('雪域瑰宝已保存')}
function saveFeatures(){localStorage.setItem('snowrealm_features12',JSON.stringify(features));alert('十二专题已保存')}
function saveProducts(){localStorage.setItem('snowrealm_home_products',JSON.stringify(products));alert('推荐特产已保存')}
function saveGallery(){localStorage.setItem('snowrealm_home_gallery',JSON.stringify(gallery));alert('摄影作品已保存')}
function saveIt(){const it={};['it_title_zh','it_title_en','it_about_zh','it_about_en','it_core_sub'].forEach(id=>{const el=document.getElementById(id);if(el)it[id]=el.value});localStorage.setItem('snowrealm_it',JSON.stringify(it));alert('IT文案已保存')}
function exportAll(){const all={home_texts:null,portals,treasures,products,features,gallery,it:null,at:new Date().toISOString()};try{all.home_texts=JSON.parse(localStorage.getItem('snowrealm_home_texts'))}catch(e){}try{all.it=JSON.parse(localStorage.getItem('snowrealm_it'))}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(all,null,2)],{type:'application/json'}));a.download='snowrealm-backup.json';a.click()}
</script></body></html>
